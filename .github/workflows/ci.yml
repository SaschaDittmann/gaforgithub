name: CI

on:
  pull_request:
    branches:
    - master
    - development

env:
  NODE_VERSION: '22.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: 'Install dependencies'
      run: npm ci
      working-directory: functions
    - name: 'Run tests'
      run: npm test
      working-directory: functions
